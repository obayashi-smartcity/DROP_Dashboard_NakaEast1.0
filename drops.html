<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5f2">
  <title>投稿 | 中之島</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="dashboard.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
  <script src="dashboard-data.js" defer></script>
  <script src="config.js" defer></script>
  <script src="drops.js" defer></script>
</head>
<body>
  <div class="dashboard-layout">
    <aside class="sidebar" aria-label="ダッシュボードメニュー">
      <a class="brand" href="index.html" aria-label="DROP 中之島サマリー">
        <span class="brand-name">DROP<span>.</span></span>
        <span class="brand-subtitle">NAKANOSHIMA</span>
      </a>
      <nav class="nav-group" aria-label="Dashboards">
        <p class="nav-caption">Dashboards</p>
        <a class="nav-link" href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9m5 10V5m5 14v-7m5 7V3"/></svg>Summary</a>
        <a class="nav-link" href="users.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1-3.5 3.5-5.2 7-5.2s6 1.7 7 5.2"/></svg>アカウント登録</a>
        <a class="nav-link active" href="drops.html" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 4-5 2v13l5-2 6 2 5-2V4l-5 2-6-2Zm0 0v13m6-11v13"/></svg>投稿</a>
      </nav>
    </aside>

    <div class="main-column">
      <header class="masthead">
        <span class="page-context">DROPS</span>
        <div class="data-status" id="data-status" role="status" aria-live="polite"><span class="status-dot" aria-hidden="true"></span><span>latest timestamp:</span><time id="latest-timestamp">—</time></div>
      </header>

      <main class="page">
        <section class="intro" aria-labelledby="page-title">
          <div><p class="eyebrow">POSTS & PLACES</p><h1 id="page-title">投稿</h1></div>
          <p class="period" id="period">対象期間を読み込み中</p>
        </section>

        <section class="metrics" aria-label="投稿概要">
          <article class="metric metric-drops"><span class="metric-label">登録ユーザーの投稿</span><strong class="metric-value" id="drop-count">—</strong><span class="metric-unit">件</span></article>
          <article class="metric"><span class="metric-label">地図に表示する投稿</span><strong class="metric-value" id="mapped-count">—</strong><span class="metric-unit">件</span></article>
        </section>

        <section class="section map-section" aria-labelledby="map-title">
          <div class="section-heading">
            <div><p class="eyebrow">POST MAP</p><h2 id="map-title">投稿地点</h2></div>
            <span class="section-note">マーカーを選択すると投稿を表示</span>
          </div>
          <div class="map-frame"><div id="post-map" role="application" aria-label="中之島の投稿地点マップ"></div></div>
          <p class="map-note" id="map-note">投稿位置を読み込み中</p>
        </section>

        <section class="section posts-section" aria-labelledby="drops-title">
          <div class="section-heading">
            <div><p class="eyebrow">POST LIST</p><h2 id="drops-title">投稿一覧</h2></div>
            <span class="section-note" id="drop-list-count"></span>
          </div>
          <div class="drop-list" id="drop-list" aria-live="polite"></div>
        </section>

        <p class="load-message" id="load-message" hidden></p>
        <footer class="page-footer">JSON生成日時 <time id="generated-at">—</time></footer>
      </main>
    </div>
  </div>
</body>
</html>
