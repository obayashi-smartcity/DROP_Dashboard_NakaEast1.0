<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5f2">
  <title>中之島 | 利用状況</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css">
  <script src="dashboard.js" defer></script>
</head>
<body>
  <header class="masthead">
    <a class="wordmark" href="#top" aria-label="中之島ダッシュボードの先頭へ">
      <span class="wordmark-mark" aria-hidden="true">D</span>
      <span>DROP <span class="wordmark-divider">/</span> NAKANOSHIMA</span>
    </a>
    <div class="data-status" id="data-status" role="status" aria-live="polite">
      <span class="status-dot" aria-hidden="true"></span>
      <span>データを読み込み中</span>
    </div>
  </header>

  <main id="top" class="page">
    <section class="intro" aria-labelledby="page-title">
      <div>
        <p class="eyebrow">利用状況ダッシュボード</p>
        <h1 id="page-title">中之島</h1>
      </div>
      <p class="period" id="period">対象期間を読み込み中</p>
    </section>

    <section class="metrics" aria-label="概要">
      <article class="metric metric-signups">
        <span class="metric-label">登録ユーザー</span>
        <strong class="metric-value" id="registration-count">—</strong>
        <span class="metric-unit">人</span>
      </article>
      <article class="metric metric-drops">
        <span class="metric-label">登録ユーザーの投稿</span>
        <strong class="metric-value" id="drop-count">—</strong>
        <span class="metric-unit">件</span>
      </article>
      <p class="updated">最終更新 <time id="updated-at">—</time></p>
    </section>

    <section class="section registrations" aria-labelledby="registration-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">SIGN-UPS</p>
          <h2 id="registration-title">登録の推移</h2>
        </div>
        <span class="section-note">日別・ユニーク登録者</span>
      </div>
      <div class="chart-scroll" id="chart-scroll">
        <div class="registration-chart" id="registration-chart" role="img" aria-label="日別登録者数"></div>
      </div>
      <div class="daily-list-wrap">
        <h3>日付別の登録者</h3>
        <div id="daily-registrations" class="daily-list"></div>
      </div>
    </section>

    <section class="section posts" aria-labelledby="posts-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">DROPS</p>
          <h2 id="posts-title">投稿</h2>
        </div>
        <span class="section-note" id="post-count-note"></span>
      </div>
      <div id="post-list" class="post-list" aria-live="polite"></div>
    </section>

    <p class="load-message" id="load-message" hidden></p>
    <footer class="page-footer">データ更新 <time id="footer-updated">—</time></footer>
  </main>
</body>
</html>
